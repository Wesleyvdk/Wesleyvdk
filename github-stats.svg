<svg xmlns="http://www.w3.org/2000/svg" width="400" height="594" viewBox="0 0 400 594" role="img" aria-labelledby="title description">
  <title id="title">Languages across Wesleyvdk + Aylian-Studios</title>
  <desc id="description">Combined repository code sizes, public + private. Forks and archived repositories are excluded. Percentages measure bytes, not expertise or personal contributions.</desc>
