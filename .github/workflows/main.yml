permissions:
  contents: write

on:
  push:
    branches: [ main ]
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch: {}

jobs:
  generate:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GH_PAT }}   # <--- put your PAT in repo secrets as GH_PAT
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Generate top-langs.svg
        run: node ./scripts/generate-top-langs.js

      - name: Commit and push svg if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git status --porcelain | grep -q "top-langs.svg"; then
            git add top-langs.svg
            git commit -m "chore: update top-langs.svg"
            git push
          else
            echo "No changes to top-langs.svg"
          fi
